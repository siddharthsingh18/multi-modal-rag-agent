[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-agent"
version = "0.1.0"
description = "Production-grade multi-modal RAG system with agentic workflows"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["rag", "ai", "llm", "agents", "multimodal", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain==0.1.20",
    "langgraph==0.0.60",
    "anthropic==0.25.0",
    "sentence-transformers==2.6.1",
    "chromadb==0.4.24",
    "qdrant-client==1.9.0",
    "unstructured==0.13.0",
    "pytesseract==0.3.10",
    "transformers==4.40.0",
    "rank-bm25==0.2.2",
    "llama-index==0.10.30",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.2.1",
    "redis==5.0.4",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "langsmith==0.1.55",
    "loguru==0.7.2",
    "prometheus-client==0.20.0",
    "ragas==0.1.7",
    "python-dotenv==1.0.1",
    "rich==13.7.1",
    "typer==0.12.3",
    "httpx==0.27.0",
    "Pillow==10.3.0",
    "beautifulsoup4==4.12.3",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov>=5.0,<6.0",
    "ruff==0.4.4",
    "black>=24.0,<25.0",
    "ipython>=8.0,<9.0",
]
pdf = [
    "unstructured[pdf]==0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
