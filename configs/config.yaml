# Main configuration file for RAG system
# Most settings can be overridden by environment variables

system:
  name: "Multi-Modal RAG Agent"
  version: "0.1.0"
  environment: "development"

llm:
  provider: "anthropic"
  model: "claude-3-5-sonnet-20241022"
  temperature: 0.0
  max_tokens: 4096
  timeout: 60

embeddings:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimension: 384
  batch_size: 32

retrieval:
  top_k: 10
  rerank_top_k: 5
  strategy: "hybrid"  # dense, sparse, or hybrid
  hybrid_alpha: 0.5  # weight for dense retrieval

chunking:
  strategy: "recursive"  # recursive or semantic
  chunk_size: 512
  chunk_overlap: 50
  separators:
    - "\n\n"
    - "\n"
    - ". "
    - " "

agent:
  max_iterations: 10
  use_reflection: true
  reflection_threshold: 6.0
  tools:
    - retriever
    - calculator
    - web_search
    - code_executor

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins:
    - "http://localhost:3000"
  rate_limit: 60  # requests per minute

observability:
  log_level: "INFO"
  langsmith_tracing: false
  prometheus_enabled: true
